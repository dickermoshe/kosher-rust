[package]
name = "kosherz"
version = "0.3.0"
edition = "2024"
publish = false
authors = ["Moshe Dicker <dickermoshe@gmail.com>"]
description = "C ABI and foreign-language bindings for kosher-rust, generated with WeaveFFI."
license = "LGPL-2.1-or-later"
repository = "https://github.com/dickermoshe/kosher-rust"
homepage = "https://github.com/dickermoshe/kosher-rust"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
kosher-rust = { path = ".." }
jiff = { version = "0.2.0", default-features = false, features = ["std", "alloc"] }
weaveffi = "0.25"

[dev-dependencies]
jiff = { version = "0.2.0", default-features = false, features = ["std", "alloc", "tzdb-bundle-always"] }

[lints]
workspace = true
