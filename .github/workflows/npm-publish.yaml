# Publishes bindings/kosher-rust-js to npm when a tag such as `npm-v0.1.0` is pushed. The tag must
# match the version in its package.json.
#
# It publishes with npm's trusted publishing, which needs no token and adds provenance. Set it up on
# npmjs.com under the package's settings, with this repository and the workflow file
# npm-publish.yaml.
name: Publish npm package

on:
  push:
    tags: ["npm-v*"]

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: bindings/kosher-rust-js

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the package version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "npm-v$version" ]; then
            echo "The tag $GITHUB_REF_NAME doesn't match version $version in package.json." >&2
            exit 1
          fi
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@^11.5.1
      - run: npm ci
      # prepublishOnly builds the package and runs its tests first.
      - run: npm publish --provenance --access public
