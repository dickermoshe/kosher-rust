name: Kosher Rust

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets  -- -D warnings

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Check documentation
        run: cargo doc --no-deps --no-default-features 
        env:
          RUSTDOCFLAGS: -D warnings

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - name: Run cargo check feature combinations
        run: cargo hack check --feature-powerset --no-dev-deps 

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack test --feature-powerset --exclude-features defmt 

  msrv:
    name: Minimum Rust version (1.93)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.93.0"
      - uses: Swatinem/rust-cache@v2
      # Checks the library only: dev-dependencies may need a newer compiler.
      - run: cargo check -p kosher-rust --all-features
      - run: cargo check -p kosher-rust --no-default-features

  no-std:
    name: no_std build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Build for a Cortex-M target without std
        run: cargo build -p kosher-rust --no-default-features --target thumbv7em-none-eabihf
      - name: Build for a Cortex-M target without std, with alloc
        run: cargo build -p kosher-rust --no-default-features --features alloc --target thumbv7em-none-eabihf

  js-interop-tests:
    name: JS Interop Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: Run JS interop tests
        working-directory: interop-tests/js_interop_tests
        run: cargo test --test js_interop

  java-interop-tests:
    name: Java Interop Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build KosherJava reference jar
        working-directory: third-party/kosher-java
        run: mvn --batch-mode "-Dmaven.javadoc.skip=true" package
      - name: Run tests
        working-directory: interop-tests/java_interop_tests
        env:
          ZMANIM_HEBREW_DATE_JAVA_PARITY_ITERATIONS: 10000
          ZMANIM_JAVA_PARITY_ITERATIONS: 10000
          ZMANIM_LIMUDIM_JAVA_PARITY_ITERATIONS: 10000
        run: cargo test 

  bindings:
    name: Bindings (Rust parity + Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the WeaveFFI CLI
        run: cargo install weaveffi-cli --version 0.25.0 --locked
      - name: Rust tests (parity with kosher-rust, generated enums up to date)
        run: cargo test -p kosherz
      - name: Generate bindings for every language
        working-directory: bindings/kosher-rust-bindings
        run: weaveffi generate --warn
      - name: Check the committed bindings are up to date
        run: |
          generated=bindings/kosher-rust-bindings/generated
          if [ -n "$(git status --porcelain -- "$generated")" ]; then
            git status --short -- "$generated"
            git --no-pager diff --stat -- "$generated"
            echo "::error::The committed bindings are out of date. Run 'weaveffi generate' in bindings/kosher-rust-bindings and commit $generated."
            exit 1
          fi
      - name: Build the Node addon
        working-directory: bindings/kosher-rust-bindings/generated/node
        env:
          KOSHERZ_LIBRARY: ${{ github.workspace }}/target/debug
        run: npm install --no-audit --no-fund
      - name: Node tests
        working-directory: bindings/kosher-rust-bindings
        run: node --test tests/node/*.test.mjs
      - name: Python example
        working-directory: bindings/kosher-rust-bindings
        env:
          KOSHERZ_LIBRARY: ${{ github.workspace }}/target/debug/libkosherz.so
          PYTHONPATH: generated/python
        run: python3 examples/smoke.py
      - name: C and C++ headers compile
        working-directory: bindings/kosher-rust-bindings/generated
        run: |
          for header in kosherz.h kosherz_buffer.h; do
            gcc -std=c11 -Wall -Wextra -Wno-unused-function -Werror -fsyntax-only -x c "c/$header"
          done
          echo '#include "kosherz.hpp"' | g++ -std=c++17 -Wall -Wextra -Wno-unused-function -Werror -fsyntax-only -I cpp -x c++ -
