name: Kosher Rust

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: Swatinem/rust-cache@v2
      - name: Check documentation
        run: cargo doc --no-deps --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check documentation with every feature, as docs.rs builds it
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - name: Run cargo check feature combinations
        run: cargo hack check --feature-powerset --no-dev-deps 

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack test --feature-powerset --exclude-features defmt 

  msrv:
    name: Minimum Rust version (1.93)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: "1.93.0"
          # Cargo 1.93 doesn't read the build.warnings setting that denies warnings on newer versions.
          rustflags: -D warnings
      - uses: Swatinem/rust-cache@v2
      # Checks the library only: dev-dependencies may need a newer compiler.
      - run: cargo check -p kosher-rust --all-features
      - run: cargo check -p kosher-rust --no-default-features

  no-std:
    name: no_std build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Build for a Cortex-M target without std
        run: cargo build -p kosher-rust --no-default-features --target thumbv7em-none-eabihf
      - name: Build for a Cortex-M target without std, with alloc
        run: cargo build -p kosher-rust --no-default-features --features alloc --target thumbv7em-none-eabihf
      - name: Build for a Cortex-M target without std, with defmt
        run: cargo build -p kosher-rust --no-default-features --features alloc,defmt --target thumbv7em-none-eabihf

  js-interop-tests:
    name: JS Interop Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: Run JS interop tests
        working-directory: interop-tests/js_interop_tests
        run: cargo test --test js_interop

  java-interop-tests:
    name: Java Interop Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build KosherJava reference jar
        working-directory: third-party/kosher-java
        run: mvn --batch-mode "-Dmaven.javadoc.skip=true" package
      - name: Run tests
        working-directory: interop-tests/java_interop_tests
        env:
          ZMANIM_HEBREW_DATE_JAVA_PARITY_ITERATIONS: 10000
          ZMANIM_JAVA_PARITY_ITERATIONS: 10000
          ZMANIM_LIMUDIM_JAVA_PARITY_ITERATIONS: 10000
        run: cargo test 
