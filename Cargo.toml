[package]
name = "kosher-rust"
version = "0.3.0"
edition = "2024"
rust-version = "1.93.0"
authors = ["Moshe Dicker <dickermoshe@gmail.com>"]
license = "LGPL-2.1-or-later"
description = "Jewish calendar, halachic times (zmanim) and daily learning schedules. A no_std port of KosherJava."
readme = "README.md"
repository = "https://github.com/dickermoshe/kosher-rust"
homepage = "https://github.com/dickermoshe/kosher-rust"
documentation = "https://docs.rs/kosher-rust"
keywords = ["zmanim", "hebrew-calendar", "jewish", "daf-yomi", "halacha"]
categories = ["date-and-time", "no-std", "internationalization"]
exclude = [
    "/interop-tests/",
    "/bindings/",
    "/third-party/",
    # About 1 MB of conformance data; the tests that read it stay in the repository.
    "/tests/fixtures/",
    "/tests/myzmanim_site.rs",
    "/.vscode/",
    "/rust-toolchain.toml",
    "/.github/",
    "/PLAN.md",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["alloc"]
# Zman::description, a paragraph explaining each zman to end users.
alloc = []
# `defmt::Format` on the public types, for embedded logging.
defmt = ["dep:defmt"]


[dependencies]
# Calendar libraries
icu_calendar = { version = "2.2.0", default-features = false }

# Datetime libraries
jiff = { version = "0.2.0", default-features = false }
jiff-icu = { version = "0.2.0", default-features = false }
core_maths = "0.1.1"

# Utility for converting enums to integers and back
num_enum = { version = "0.7.0", default-features = false }

# Logging to embedded targets
defmt = { version = "1.0.0", optional = true }

# Utility for creating custom error types
thiserror = { version = "2.0.18", default-features = false }

[dev-dependencies]
jiff = { version = "0.2.0", default-features = false, features = [
    "std",
    "alloc",
    "tzdb-bundle-always",
] }
# MyZmanim site fixture (tests/fixtures/myzmanim-site.bin): postcard-encoded, deflated.
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1", features = ["use-std"] }
flate2 = "1.1"
divan = "0.1"

[lints]
workspace = true

[workspace]
resolver = "2"
members = ["interop-tests/java_interop_tests", "interop-tests/js_interop_tests", "bindings/kosher-ffi"]

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[[bench]]
name = "kosher"
harness = false
