[package]
name = "kosher-rust-js"
version = "0.1.0"
edition = "2024"
authors = ["Moshe Dicker <dickermoshe@gmail.com>"]
license = "LGPL-2.1-or-later"
description = "Builds the WebAssembly of the kosher-rust npm package."
repository = "https://github.com/dickermoshe/kosher-rust"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[dependencies]
kosher-rust = { path = "../..", default-features = false, features = ["wasm"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
jiff = { version = "0.2.0", default-features = false, features = ["std", "alloc", "tzdb-bundle-always"] }
serde = "1.0"
serde_json = "1.0"

[lints]
workspace = true
